name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # The same site in each language, against the same smoke checks (direct and behind Caddy).
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, csharp, typescript]
    name: smoke (${{ matrix.lang }})
    env:
      CADDY_VERSION: 2.11.7
      SITE_DB: stdb-site
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (wasm32)
        if: matrix.lang == 'rust'
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        if: matrix.lang == 'rust'
        with:
          workspaces: rust

      # C# builds with NativeAOT-LLVM (.NET 10 on Linux).
      - uses: actions/setup-dotnet@v4
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: TypeScript deps + embedded site
        if: matrix.lang == 'typescript'
        working-directory: typescript
        run: |
          npm ci
          npm run typecheck

      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Caddy
        run: |
          curl -sSL -o caddy.tgz "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          tar -xzf caddy.tgz caddy && sudo install -m755 caddy /usr/local/bin/caddy && caddy version

      - name: Start SpacetimeDB
        run: |
          nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 --non-interactive > spacetime.log 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done

      - name: Publish the ${{ matrix.lang }} module
        run: |
          echo "SITE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: spacetime publish "$SITE_DB" -s local -y -p ${{ matrix.lang }}

      - name: Start Caddy
        working-directory: proxy
        run: |
          SITE_PROXY_ROOT=$PWD nohup caddy run --config Caddyfile > ../caddy.log 2>&1 &
          for i in $(seq 15); do curl -sf -o /dev/null http://stdb-site.localhost:8080/ && break; sleep 1; done

      - name: Smoke tests
        run: SITE_LANG=${{ matrix.lang }} DB=$SITE_DB PROXY_URL=http://stdb-site.localhost:8080 scripts/smoke.sh

      - name: Throughput (rough; shared CI runner)
        run: node scripts/bench.mjs "$SITE_DB" 3 16

      - name: Server logs
        if: failure()
        run: tail -n 100 spacetime.log caddy.log || true
